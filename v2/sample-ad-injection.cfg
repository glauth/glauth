#################
# glauth.conf

#################
# General configuration.
#debug = true
syslog = true

#################
# Server configuration.
[ldap]
  enabled = true
  listen = "0.0.0.0:3893"

[ldaps]
  enabled = false
  listen = "0.0.0.0:636"
  cert = "glauth.crt"
  key = "glauth.key"

#################
# The backend section controls the data store.
[[backends]]
  datastore = "ldap"
  servers = [ "ldap://192.168.1.222:389" ]
  # The local [[users]] records below add a second factor to accounts held by
  # the upstream server. GLAuth can only enforce it when it can tell which local
  # record a bind refers to; a bind it cannot match to a record is passed
  # upstream on the password alone.
  #
  # GLAuth recognises users named in a DN by cn, uid, sAMAccountName, mail or
  # userPrincipalName, plus whatever nameformat lists (default "cn,uid"). If
  # your directory names entries by any other attribute - for example
  # employeeNumber=1234,ou=people,... - add it, and name the local record by
  # that value:
  # nameformat = "cn,uid,employeeNumber"
  #
  # Users who bind with an address (user@example.com, as Active Directory
  # allows) are matched against the "mail" of the local record, so set "mail"
  # to that exact address for every user who has an otpsecret.

[[backends]]
  datastore = "config"

[[users]]
  name = "otpuser"
  # mail = "otpuser@example.com"  # required if this user binds with an address
  otpsecret = "3hnvnk4ycv44glzigd6s25j4dougs3rk"

#################
# Enable and configure the optional REST API here.
[api]
  enabled = false
  tls = true
  listen = "localhost:5555"
  cert = "glauth.crt"
  key = "glauth.key"

