# Proxy: delegates the password upstream, adds OTP from a local record.
debug = true
[ldap]
  enabled = true
  listen = "127.0.0.1:3894"
[ldaps]
  enabled = false
[[backends]]
  datastore = "ldap"
  servers = [ "ldap://127.0.0.1:3893" ]
  baseDN = "dc=glauth,dc=com"
  nameformat = "cn"
  groupformat = "ou"
[[backends]]
  datastore = "config"
  baseDN = "dc=glauth,dc=com"
  nameformat = "cn"
  groupformat = "ou"
[[users]]
  name = "otpuser"
  mail = "otpuser@glauth.com"
  uidnumber = 5001
  primarygroup = 5501
  otpsecret = "3hnvnk4ycv44glzigd6s25j4dougs3rk"
    [[users.capabilities]]
    action = "search"
    object = "*"
[[groups]]
  name = "superheros"
  gidnumber = 5501
[api]
  enabled = false
