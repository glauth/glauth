# Topology C: pure proxy, NO local records at all. The fail-open must survive:
# a user we hold no record for must bind with the password alone.
debug = true
[ldap]
  enabled = true
  listen = "127.0.0.1:3898"
[ldaps]
  enabled = false
[[backends]]
  datastore = "ldap"
  servers = [ "ldap://127.0.0.1:3897" ]
  baseDN = "dc=glauth,dc=com"
  nameformat = "cn"
  groupformat = "ou"
[api]
  enabled = false
