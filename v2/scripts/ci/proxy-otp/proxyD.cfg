# Proxy for the disabled-overlay test (GHSA-2wj6-h65w-v37c): passwords are
# delegated upstream, and a config overlay marks svcuser disabled. The disabled
# overlay record must deny the bind even though the upstream password is valid -
# the proxy sibling of the config-backend fix in #470.
debug = true
[ldap]
  enabled = true
  listen = "127.0.0.1:13908"
[ldaps]
  enabled = false
[[backends]]
  datastore = "ldap"
  servers = [ "ldap://127.0.0.1:13907" ]
  baseDN = "dc=glauth,dc=com"
  nameformat = "cn"
  groupformat = "ou"
[[backends]]
  datastore = "config"
  baseDN = "dc=glauth,dc=com"
  nameformat = "cn"
  groupformat = "ou"
[[users]]
  name = "gooduser"
  uidnumber = 5001
  primarygroup = 5501
    [[users.capabilities]]
    action = "search"
    object = "*"
[[users]]
  name = "svcuser"
  uidnumber = 5002
  primarygroup = 5501
  disabled = true
    [[users.capabilities]]
    action = "search"
    object = "*"
[[groups]]
  name = "superheros"
  gidnumber = 5501
[api]
  enabled = false
