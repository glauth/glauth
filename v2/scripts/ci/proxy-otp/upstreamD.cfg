# Upstream directory for the disabled-overlay test: owns the passwords, knows
# nothing about OTP, and has no notion of "disabled" - that lives only in the
# proxy's config overlay.
debug = true
[ldap]
  enabled = true
  listen = "127.0.0.1:13907"
[ldaps]
  enabled = false
[[backends]]
  datastore = "config"
  baseDN = "dc=glauth,dc=com"
  nameformat = "cn"
  groupformat = "ou"
[[users]]
  name = "gooduser"
  uidnumber = 5001
  primarygroup = 5501
  passsha256 = "652c7dc687d98c9889304ed2e408c74b611e86a40caa51c4b43f1dd5913c5cd0" # mysecret
    [[users.capabilities]]
    action = "search"
    object = "*"
